<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOP Assistant</title>
<style>
  :root{
    --ink:#13212C; --ink-soft:#22323F; --paper:#FFFFFF; --bg:#F4F6F7;
    --accent:#D98A2B; --accent-dark:#B36F1E; --accent-soft:#FBEBD6;
    --slate:#5C6B78; --slate-light:#8A98A3; --line:#E3E7EA;
    --success:#2F8F5C; --success-soft:#E4F3EC;
    --warning:#C1443C; --warning-soft:#FBEAE8;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:var(--font); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; height:100%;}
  #app{display:flex; flex-direction:column; height:100vh;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 24px; background:var(--ink); color:#fff; flex-shrink:0;}
  .topbar-left{display:flex; align-items:center; gap:14px;}
  .brand{font-size:15px; font-weight:700; color:var(--accent);}
  .status-pill{font-size:12.5px; font-weight:600; color:#CBD5DA; background:rgba(255,255,255,0.08); padding:5px 12px; border-radius:20px;}
  .status-pill b{color:#fff;}
  .tabs{display:flex; gap:6px;}
  .tab-pill{background:transparent; border:1px solid rgba(255,255,255,0.22); color:#CBD5DA; padding:7px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font);}
  .tab-pill.active{background:var(--accent); border-color:var(--accent); color:#1A1200;}
  .reset-link{background:transparent; border:none; color:#CBD5DA; font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font);}
  .reset-link:hover{color:#fff;}

  .chat-wrap{flex:1; display:flex; flex-direction:column; overflow:hidden;}
  .chat-scroll{flex:1; overflow-y:auto; padding:28px 20px 12px; display:flex; justify-content:center;}
  .chat-inner{width:100%; max-width:680px;}
  .msg-row{display:flex; margin-bottom:18px;}
  .msg-row.user{justify-content:flex-end;}
  .msg-row.assistant{justify-content:flex-start;}
  .bubble{max-width:78%; padding:12px 16px; border-radius:14px; font-size:15px; line-height:1.55;}
  .msg-row.user .bubble{background:var(--ink); color:#fff; border-bottom-right-radius:4px;}
  .msg-row.assistant .bubble{background:var(--paper); border:1px solid var(--line); color:var(--ink); border-bottom-left-radius:4px;}
  .bubble.bubble-warning{background:var(--warning-soft); border:1px solid #F1C6C1; color:#7A2620;}
  .assistant-block{max-width:92%;}

  .account-tag{font-size:12px; font-weight:700; color:var(--slate); margin-bottom:8px;}
  .step-card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin-top:8px;}
  .role-chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--accent-dark); background:var(--accent-soft); padding:4px 11px; border-radius:20px; margin-bottom:12px;}
  .role-chip.decision{color:#8A5A00; background:#FBEBD6;}
  .card-title{font-size:19px; font-weight:700; letter-spacing:-0.01em; margin:0 0 14px; line-height:1.3;}
  .bullets{list-style:none; margin:0 0 6px; padding:0;}
  .bullets li{position:relative; padding-left:20px; margin-bottom:11px; font-size:14.5px; line-height:1.55; color:#2A3A45;}
  .bullets li::before{content:""; position:absolute; left:0; top:8px; width:6px;height:6px;border-radius:50%; background:var(--accent);}
  .term{border-bottom:1.5px dotted var(--slate-light); cursor:help; font-weight:600; color:var(--ink);}
  .term:hover{border-bottom-color:var(--accent-dark); color:var(--accent-dark);}

  .question-text{font-size:15px; font-weight:600; margin:0 0 14px;}
  .quick-replies{display:flex; flex-direction:column; gap:8px; margin-top:4px;}
  .qr-btn{text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; cursor:pointer; font-family:var(--font); transition:border-color .12s ease, background .12s ease;}
  .qr-btn:hover{border-color:var(--accent); background:var(--accent-soft);}
  .qr-label{font-size:14.5px; font-weight:700; color:var(--ink);}
  .qr-hint{font-size:12.5px; color:var(--slate); margin-top:2px;}
  .qr-next{display:inline-block; margin-top:6px; background:var(--ink); color:#fff; border:none; padding:10px 18px; border-radius:9px; font-size:14px; font-weight:700; cursor:pointer; font-family:var(--font);}
  .qr-next:hover{background:var(--ink-soft);}

  .end-badge{font-size:11.5px; font-weight:700; margin-bottom:8px;}
  .step-card.success .end-badge{color:var(--success);}
  .step-card.warning .end-badge{color:var(--warning);}
  .step-card.success{background:var(--success-soft); border-color:#BFE3CE;}
  .step-card.warning{background:var(--warning-soft); border-color:#F1C6C1;}
  .restart-chip{margin-top:10px; display:inline-block; background:var(--ink); color:#fff; border:none; padding:9px 16px; border-radius:9px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:var(--font);}

  .outbound-toggle{display:flex; gap:8px; margin:10px 0 12px;}
  .ob-tab{flex:1; padding:8px 10px; border-radius:8px; border:1.5px solid var(--line); background:#fff; font-size:12.5px; font-weight:700; cursor:pointer; font-family:var(--font); color:var(--slate);}
  .ob-tab.active{border-color:var(--ink); color:var(--ink);}
  .ob-summary{font-size:13px; font-weight:700; color:var(--slate); margin:10px 0 8px;}
  .ob-list{list-style:decimal; padding-left:18px; margin:0;}
  .ob-list li{font-size:13.5px; line-height:1.5; color:#2A3A45; margin-bottom:6px;}

  .typing-dots{display:flex; gap:4px; padding:6px 2px;}
  .typing-dots span{width:6px;height:6px;border-radius:50%; background:var(--slate-light); animation:blink 1.2s infinite ease-in-out;}
  .typing-dots span:nth-child(2){animation-delay:.2s;}
  .typing-dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  .error-note{font-size:13px; color:var(--warning); margin-top:8px;}

  .input-bar{border-top:1px solid var(--line); background:#fff; padding:16px 20px; display:flex; justify-content:center; flex-shrink:0;}
  .input-inner{width:100%; max-width:680px; display:flex; gap:10px;}
  .input-inner input{flex:1; padding:13px 16px; border-radius:12px; border:1.5px solid var(--line); font-size:15px; font-family:var(--font); outline:none;}
  .input-inner input:focus{border-color:var(--accent);}
  .send-btn{background:var(--ink); color:#fff; border:none; padding:0 22px; border-radius:12px; font-size:14.5px; font-weight:700; cursor:pointer; font-family:var(--font);}
  .send-btn:disabled{opacity:0.5; cursor:default;}
  .hint-row{text-align:center; font-size:12.5px; color:var(--slate-light); padding:0 20px 12px;}

  .browse-wrap{flex:1; display:flex; overflow:hidden;}
  .rail{width:280px; flex-shrink:0; background:var(--ink); color:#fff; padding:24px 22px; overflow-y:auto;}
  .rail-process{font-size:17px; font-weight:700; margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid rgba(255,255,255,0.12);}
  .trail-item{display:flex; gap:12px; cursor:pointer; padding-bottom:18px;}
  .trail-item .dot-col{display:flex; flex-direction:column; align-items:center; width:14px;}
  .trail-item .dot{width:9px;height:9px;border-radius:50%; background:rgba(255,255,255,0.28); margin-top:4px;}
  .trail-item .stem{width:2px; flex:1; background:rgba(255,255,255,0.16); margin-top:2px;}
  .trail-item.done .dot{background:var(--success);}
  .trail-item.current .dot{background:var(--accent); box-shadow:0 0 0 4px rgba(217,138,43,0.25);}
  .trail-role{font-size:11px; font-weight:600; color:var(--accent); margin-bottom:2px;}
  .trail-item.done .trail-role{color:#8FD4AE;}
  .trail-title{font-size:13px; color:#EAEDEF; line-height:1.35;}
  .browse-stage{flex:1; overflow-y:auto; display:flex; justify-content:center; padding:44px 28px;}
  .browse-inner{width:100%; max-width:600px;}
  .proc-card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:22px 24px; margin-bottom:14px; cursor:pointer;}
  .proc-card:hover{border-color:var(--accent);}
  .proc-tag{display:inline-block; font-size:11.5px; font-weight:700; color:var(--accent-dark); background:var(--accent-soft); padding:3px 10px; border-radius:20px; margin-bottom:10px;}
  .proc-card h2{font-size:19px; margin:0 0 6px;}
  .proc-card p{font-size:14px; color:var(--slate); margin:0; line-height:1.5;}
  .btn-row{display:flex; align-items:center; margin-top:16px; gap:10px;}
  .ghost-btn{background:transparent; color:var(--slate); border:1.5px solid var(--line); padding:10px 18px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; font-family:var(--font);}
  .primary-btn{background:var(--ink); color:#fff; border:none; padding:11px 22px; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; font-family:var(--font);}

  #tooltip{position:fixed; max-width:280px; background:var(--ink); color:#fff; font-size:13.5px; line-height:1.5; padding:12px 14px; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.25); z-index:999; pointer-events:none; opacity:0; transform:translateY(4px); transition:opacity .12s ease, transform .12s ease;}
  #tooltip.visible{opacity:1; transform:translateY(0);}

  .modal-overlay{position:fixed; inset:0; background:rgba(19,33,44,0.55); display:flex; align-items:center; justify-content:center; z-index:1000;}
  .modal-overlay.hidden{display:none;}
  .modal-box{background:#fff; border-radius:16px; padding:28px 26px; width:90%; max-width:420px; box-shadow:0 20px 50px rgba(0,0,0,0.25);}
  .modal-box h3{margin:0 0 10px; font-size:18px;}
  .modal-box p{margin:0 0 16px; font-size:13.5px; color:var(--slate); line-height:1.55;}
  .modal-box p a{color:var(--accent-dark); font-weight:600;}
  .modal-box input{width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); font-size:14.5px; font-family:var(--font); margin-bottom:16px; outline:none;}
  .modal-box input:focus{border-color:var(--accent);}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end;}

  @media (max-width:760px){
    .rail{display:none;}
    .topbar{padding:12px 16px;}
    .tabs{gap:4px;}
    .tab-pill{padding:6px 10px; font-size:12px;}
    .status-pill{display:none;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="tooltip"></div>

<script>
/* =====================================================================
   API CONFIG
   This uses Groq's free-tier API (https://console.groq.com) instead of
   Claude.ai's built-in artifact API, so this file works as a standalone
   HTML page anywhere -- not just inside Claude.ai.

   Get a free key at: https://console.groq.com/keys (no credit card needed)

   OPTIONAL: if this file stays private to you (not shared/hosted publicly),
   you can paste your key below to skip the in-app prompt every session.
   Never do this if you plan to share or publicly host this file.
===================================================================== */
const HARDCODED_API_KEY = ""; // e.g. "gsk_xxxxxxxxxxxxxxxxxxxx"
const GROQ_MODEL = "openai/gpt-oss-20b";

const RESPONSE_SCHEMA = {
  type: "object",
  properties: {
    reply: {type: "string"},
    process: {type: ["string", "null"]},
    step_id: {type: ["string", "null"]},
    not_found: {type: "boolean"},
    suggested_replies: {type: "array", items: {type: "string"}}
  },
  required: ["reply", "process", "step_id", "not_found", "suggested_replies"],
  additionalProperties: false
};
const GROQ_ENDPOINT = "https://api.groq.com/openai/v1/chat/completions";

/* ============================= GLOSSARY ============================= */
const GLOSSARY = {
  eta: "Estimated Time of Arrival — when the truck is expected to reach its destination.",
  tms: "Transport Management System — the software used to plan trips and track trucks.",
  wms: "Warehouse Management System — software used to manage stock and picking in the warehouse.",
  dmr: "Daily Monitoring Report — a daily log used to track deliveries and flag issues.",
  rdd: "Required Delivery Date — the date by which the customer needs the goods.",
  dsc: "DHL Supply Chain — the DHL division running this operation.",
  klang: "Klang Valley — the greater Kuala Lumpur metro area, which gets shorter response-time targets than Outstation deliveries.",
  outstation: "Outstation — deliveries outside the Klang Valley area, which get longer time allowances.",
  chep: "CHEP / LOSCAM — third-party pallet-pooling companies. If a customer uses one of these, a separate pallet docket must be printed to track loaned pallets.",
  tmc: "TMC — the transport team/coordinator that books trucks with the appointed transport partners.",
  adhoc: "Ad-hoc Trip Approval — a special sign-off needed when a delivery falls outside the normal planned trucks or transporters.",
  po: "PO — Purchase Order, the customer's order document.",
  ordertype: "Order type TT/DC = palletized goods. Order type KA = non-palletized (loose carton) goods.",
  grn: "GRN — Goods Received Note, the customer's signed confirmation that goods were received.",
  cbt: "CBT — Charge Back Transporter. If a rejection or damage is confirmed to be the transporter's fault, the cost is charged back to them.",
  threepl: "3PL — Third-Party Logistics provider, an outside company handling transport or warehousing on the customer's behalf.",
  sst: "SST — Sales and Service Tax, a Malaysian tax registration required for vendor onboarding.",
  gtmt: "GT / MT — GT (General Trade) orders must be palletized. MT (Manual Handling) orders are loose and loaded by DHL drivers rather than the warehouse.",
  signonglass: "Sign-On-Glass — a digital app drivers use on a handheld device to track deliveries and upload POD photos.",
  tranzalliance: "Tranzalliance — Haleon's appointed 3PL transporter/warehouse partner.",
  obd: "OBD — Outbound Delivery number, used to match physical stock against the system record.",
  fbmilestones: "FBMT/FBST/FBDT/FBPT — Fonterra TMS milestone codes: Fonterra delivery, Fonterra Shunting, Dairymas, and Pallet transfer."
};
function t(word, key){ return `<span class="term" tabindex="0" data-key="${key}">${word}</span>`; }
function stripTags(html){ return html.replace(/<[^>]+>/g, ""); }

/* ============================= HALEON — BREAKDOWN MANAGEMENT ============================= */
const HALEON_BREAKDOWN = {
  key:"haleon_breakdown",
  account:"Haleon",
  processType:"Breakdown Management",
  name: "Haleon — Breakdown Management",
  tag: "Breakdown handling",
  blurb: "What to do when a delivery truck breaks down mid-route.",
  startId: "driver_report",
  nodes: {
    driver_report: {type:"step", role:"Driver", title:"Report the breakdown", bullets:[
      "Truck breakdown occurs — driver must immediately inform the transport planner.",
      "Driver parks the truck in a shaded, safe area and checks for any visible issues or system failure.",
      "Driver calls the nearest foreman or workshop for rescue, within 30 minutes."
    ], next:"foreman_assess"},
    foreman_assess: {type:"step", role:"Foreman / Workshop", title:"Assess the truck", bullets:[
      `Foreman or workshop PIC must reach the rescue site within 1 hour for ${t("Klang Valley","klang")}, or 2 hours for ${t("Outstation","outstation")}.`,
      "Foreman conducts a thorough inspection to classify the breakdown."
    ], next:"classify"},
    classify: {type:"decision", role:"Foreman / Workshop", title:"Classify the breakdown", question:"What kind of breakdown is it?", options:[
      {label:"Minor breakdown", hint:"Tires & wheels, electrical, or fuel system", next:"minor_repair"},
      {label:"Major breakdown", hint:"Engine, transmission, brakes, suspension/steering, or cooling/air system", next:"major_advise_tow"}
    ]},
    minor_repair: {type:"step", role:"Foreman", title:"Repair on site", bullets:[
      "For a minor breakdown, the foreman repairs the truck on site.",
      "Repair must be completed within a 2-hour timeline."
    ], next:"minor_window_check"},
    minor_window_check: {type:"decision", role:"Foreman", title:"Check the delivery window", question:"Can the driver still deliver within the promised window?", options:[
      {label:"Yes", hint:"Truck can still make it in time", next:"minor_resume"},
      {label:"No", hint:"Window will be missed", next:"minor_return"}
    ]},
    minor_resume: {type:"step", role:"Driver", title:"Resume the delivery", bullets:[
      `Driver resumes the delivery and updates the DHL planner on the new ${t("ETA","eta")}.`
    ], next:"minor_monitor"},
    minor_monitor: {type:"step", role:"DHL Planner", title:"Monitor to completion", bullets:[
      `Planner reports the updated ${t("ETA","eta")} to Haleon and monitors the truck status until delivery is complete.`,
      "Planner updates and reports to Haleon once delivery is completed."
    ], next:"end_delivered"},
    minor_return: {type:"step", role:"Driver", title:"Return the goods", bullets:[
      "Goods are returned to the warehouse, since the ETA to the consignee will exceed the delivery window.",
      "Driver updates the new ETA to the warehouse and DHL planner."
    ], next:"minor_reschedule"},
    minor_reschedule: {type:"step", role:"DHL Planner", title:"Reschedule the delivery", bullets:[
      "Planner reports the delivery failure to Haleon and reschedules for next-day pickup.",
      "Planner informs the warehouse to receive the returned goods and perform a quality check on handover."
    ], next:"end_rescheduled"},
    major_advise_tow: {type:"step", role:"Foreman", title:"Advise towing", bullets:[
      "For a major breakdown, the foreman advises the transporter to tow the truck back to the warehouse."
    ], next:"major_tow_check"},
    major_tow_check: {type:"decision", role:"Foreman", title:"Check tow availability", question:"Can the truck be towed immediately?", options:[
      {label:"Yes", next:"major_vendor_tow"},
      {label:"No", hint:"No tow truck available right away", next:"major_replacement"}
    ]},
    major_vendor_tow: {type:"step", role:"Transport Vendor", title:"Tow the truck", bullets:[
      "Transporter sources their own tow truck vendor.",
      `Tow truck should arrive within 2 hours for ${t("Klang Valley","klang")}; timing for ${t("Outstation","outstation")} varies by departure location.`
    ], next:"major_vendor_report"},
    major_vendor_report: {type:"step", role:"Transport Planner", title:"Report and reschedule", bullets:[
      "Planner informs Haleon and the warehouse of the action taken and the delivery failure.",
      `Truck is towed back to the warehouse for offloading — same day for ${t("Klang Valley","klang")}, next day for ${t("Outstation","outstation")}.`
    ], next:"end_towed"},
    major_replacement: {type:"step", role:"Transport Planner", title:"Dispatch a replacement truck", bullets:[
      "Planner notifies Haleon and dispatches a replacement truck to the breakdown site."
    ], next:"major_stock_move"},
    major_stock_move: {type:"step", role:"Transport Planner", title:"Move the stock", bullets:[
      "If the breakdown is near the warehouse, a forklift can be used to move stock to the replacement truck.",
      "If it happens far from equipment, stock can only be moved manually — in small, safe quantities."
    ], next:"major_update"},
    major_update: {type:"step", role:"Transport Planner", title:"Update Haleon", bullets:[
      "Planner updates Haleon on the replacement truck's status and new ETA.",
      "Planner updates and reports to Haleon once delivery is completed."
    ], next:"end_replacement"},
    end_delivered: {type:"end", tone:"success", title:"Delivered on schedule", body:"The truck was repaired on site and completed the delivery within the promised window."},
    end_rescheduled: {type:"end", tone:"warning", title:"Delivery rescheduled", body:"Repair couldn't be completed in time — goods were returned to the warehouse and delivery is rescheduled for next-day pickup."},
    end_towed: {type:"end", tone:"warning", title:"Truck towed back", body:"The truck was towed back to the warehouse for offloading, and the delivery was rescheduled."},
    end_replacement: {type:"end", tone:"success", title:"Replacement dispatched", body:"A replacement truck completed the delivery while the broken-down truck is recovered separately."}
  }
};

/* ============================= HALEON — TRANSPORTER SOP (PLANNING) ============================= */
const HALEON_TRANSPORTER = {
  key:"haleon_transporter",
  account:"Haleon",
  processType:"Transporter SOP (Planning)",
  name: "Haleon — Transporter SOP",
  tag: "Daily transporter planning",
  blurb: "The transporter's day-to-day cycle: order receipt, truck confirmation, loading checks, and POD handling.",
  startId: "order_receipt",
  nodes: {
    order_receipt: {type:"step", role:"DHL Transport Planner", title:"Receive and plan the order", bullets:[
      "Every day at 5:00 PM, the DHL Transport Team receives the next-day order list from Tranzalliance via email, including pallet quantity and delivery region.",
      `The Haleon Planner performs next-day planning based on pallet quantity, region, and customer requirements. Planning is shared with dedicated DHL 3rd-party transporters via email and WhatsApp.`
    ], next:"transporter_confirm"},
    transporter_confirm: {type:"step", role:"Transporter", title:"Confirm truck details", bullets:[
      "Transporters must confirm truck number, driver name, and ETA for the next-day movement."
    ], next:"planner_prepare"},
    planner_prepare: {type:"step", role:"DHL Transport Planner", title:"Prepare the Master Load Plan", bullets:[
      `Planner prepares the Master Load Plan and shares it with ${t("Tranzalliance","tranzalliance")} before 7:00 PM for picking and arrangement.`,
      `Planner shares truck summary and ETA in the operations WhatsApp group, and pushes orders in ${t("TMS","tms")} via driver ID for ${t("Sign-On-Glass","signonglass")} tracking.`
    ], next:"arrival_check"},
    arrival_check: {type:"step", role:"Transporter and Driver", title:"Truck arrival", bullets:[
      "Trucks must arrive according to the confirmed ETA, be clean and hygienic, and drivers must be licensed and carry ID cards."
    ], next:"preload_check"},
    preload_check: {type:"step", role:"Transporter and Driver", title:"Pre-loading checks", bullets:[
      "Before loading, the driver must perform parameter checking for all loads, complete the DHL Pre-Loading Checklist, and record temperature readings in the temperature logbook.",
      `Drivers must use ${t("Sign-On-Glass","signonglass")} for tracking and POD upload.`
    ], next:"discrepancy_check2"},
    discrepancy_check2: {type:"decision", role:"Transporter / Driver", title:"Check for discrepancies", question:"Are there any discrepancies?", options:[
      {label:"Yes", next:"report_discrepancy"},
      {label:"No", next:"collect_pod"}
    ]},
    report_discrepancy: {type:"step", role:"Transporter / Driver", title:"Report the discrepancy", bullets:[
      "Driver must report to DHL immediately, and drivers cannot leave the customer site without instruction."
    ], next:"handle_returns"},
    handle_returns: {type:"step", role:"Transporter / Driver", title:"Handle any returns", bullets:[
      `If there are returns or rejections, the driver must inform DHL immediately and return the items to ${t("Tranzalliance","tranzalliance")} the same day or next day, based on instructions.`
    ], next:"pod_handling"},
    collect_pod: {type:"step", role:"Transport / Driver", title:"Collect the POD", bullets:[
      "Driver can collect the POD and upload it into the DHL portal."
    ], next:"pod_handling"},
    pod_handling: {type:"step", role:"POD Handling", title:"Submit the POD", bullets:[
      "Drivers must collect the POD immediately after delivery. If unable, they must inform DHL Ops.",
      "POD picture must be uploaded in DC Apps / Sign-On-Glass. All PODs must be submitted within 3 working days."
    ], next:"end_complete"},
    end_complete: {type:"end", tone:"success", title:"Delivery cycle complete", body:"Truck loaded, delivered, and POD submitted within the required 3-working-day window."}
  }
};

/* ============================= HALEON — OUTBOUND PROCESS ============================= */
const HALEON_OUTBOUND = {
  key:"haleon_outbound",
  account:"Haleon",
  processType:"Outbound Process",
  name: "Haleon — Outbound Process",

/* ============================= PROMPT SERIALIZATION ============================= */
function serializeGraph(proc){
  const clean = {};
  for(const [id, n] of Object.entries(proc.nodes)){
    if(n.type === "step"){
      clean[id] = {type:"step", role:n.role, title:n.title, bullets:n.bullets.map(stripTags), next:n.next};
    } else if(n.type === "decision"){
      clean[id] = {type:"decision", role:n.role, title:n.title, question:n.question,
        options:n.options.map(o=>({label:o.label, hint:o.hint||"", next:o.next}))};
    } else if(n.type === "end"){
      clean[id] = {type:"end", title:n.title, body:n.body, outcome:n.tone};
    }
  }
  return clean;
}
const PROCESS_INDEX_TEXT = JSON.stringify(
  Object.entries(PROCESSES).map(([key, proc]) => ({
    key, account: proc.account, processType: proc.processType, blurb: proc.blurb
  })),
  null, 0
);

const GRAPH_CACHE = {};
function getGraphText(processKey){
  if(!PROCESSES[processKey]) return null;
  if(!GRAPH_CACHE[processKey]){
    const proc = PROCESSES[processKey];
    GRAPH_CACHE[processKey] = JSON.stringify(
      {account: proc.account, processType: proc.processType, start: proc.startId, nodes: serializeGraph(proc)},
      null, 0
    );
  }
  return GRAPH_CACHE[processKey];
}

const AVAILABLE_LIST = Object.values(PROCESSES).map(p => `- ${p.account} \u2192 ${p.processType} (key "${p.key}")`).join("\n");

function buildSystemPrompt(knownProcessKey){
  const knownGraphBlock = knownProcessKey
    ? `\n\nThe conversation has already identified the process as "${knownProcessKey}". Here is its FULL graph as JSON — use this to pick the exact "step_id" (a node from this graph's "nodes" map), including moving to downstream nodes as the conversation progresses:\n${getGraphText(knownProcessKey)}`
    : `\n\nNo specific process has been identified yet. Use the index above to work out which process (if any) applies, and set "process" to its key. You do NOT have that process's detailed node graph yet in this message — so on this turn, only ever set "step_id" to null. Once "process" is set, the next message will include that process's full graph so a "step_id" can be chosen.`;

  return `You are an SOP assistant for logistics staff who may have no prior knowledge of these procedures.

Only the following account + SOP combinations exist. Never invent, assume, guess, or borrow steps from a similar SOP for any combination not listed here. This is the INDEX of every available process (key, account, processType, short description):
${PROCESS_INDEX_TEXT}

"General" is not a real customer account — those two SOPs (Customer Complaint Handling, Vendor Registration) apply across any account, including accounts not listed above (e.g. Reckitt Benckiser is mentioned inside the Customer Complaint SOP itself as an example, even though it has no dedicated account entry here). If the user's message clearly matches one of these two general processes — a customer complaint, or onboarding/registering a new transport vendor — route to it directly using its "general_..." key, regardless of which account (if any) they mention. Do not ask "which account" for these two.

Each process graph (once provided below) has "account", "processType", a "start" node id, and a "nodes" map. Node types:
- "step": an action a role performs. Has "bullets".
- "decision": a branch point. Has a "question" and "options" (each option has "label" and "next", the node id to go to if that option is chosen).
- "end": a final outcome.
${knownGraphBlock}

Rules:
1. Some accounts have more than one SOP (e.g. Haleon has five: Breakdown Management, Transporter SOP, Outbound Process, Inbound Process, and POD Rejection Process). If the user names an account but the situation could match more than one of that account's SOPs, or names a process type without an account (e.g. "transport planning", "breakdown procedure", or describes a situation like "a truck broke down") and more than one account could have it, do NOT guess. Ask a short clarifying question naming the specific options. Set "process": null, "step_id": null, "not_found": false. You may include "suggested_replies" with up to 4 short tap options (account names, or process names) to speed this up.
2. If the user asks about an account + process type combination that is NOT in the index above, do not improvise or borrow steps from a different SOP or account. Clearly state in "reply" that this SOP does not exist for that account, and mention which SOPs are actually available for that account (from the index). Set "process": null, "step_id": null, "not_found": true.
3. If the process is already known (see above) but you still need one more detail to land on the exact node (e.g. minor vs major, yes vs no), ask a short, specific clarifying question referencing the real decision at hand, using that process's graph. Set "step_id": null but keep "process" set. Set "not_found": false.
4. Once you can identify a specific node with reasonable confidence (which requires the full graph for that process to already be provided to you above), set "process" and "step_id" to the exact node id from that graph. In "reply", write ONE short, friendly sentence that explicitly names both the account (or "General" for the two account-agnostic SOPs) and the SOP process name (e.g. "For Haleon's Breakdown Management SOP — that sounds like a major breakdown, here's what to do next:"). Do NOT restate the step's bullets or question text yourself; the app renders those separately from the graph data. Set "not_found": false.
5. If the user's message describes something further along an already-known process (e.g. "the driver couldn't make the window in time"), move to the correct downstream node directly rather than restarting from the beginning.
6. If the message is entirely unrelated to all the SOPs listed in the index, politely say this assistant only covers the SOPs listed there, and set "process" and "step_id" to null, "not_found": false.
7. Respond with ONLY a raw JSON object and nothing else — no markdown fences, no commentary before or after:
{"reply": "short sentence, clarifying question, or not-found explanation", "process": "<process key from the index>" | null, "step_id": "<exact node id, only if that process's full graph was provided to you above>" | null, "not_found": true | false, "suggested_replies": ["optional", "short", "tap options", "max 4"]}`;
}

function renderChat(){
  const body = document.getElementById("body");
  body.innerHTML = `
    <div class="chat-wrap">

        <div class="chat-inner" id="chatInner"></div>
      </div>
      <div class="hint-row">Describe a situation, e.g. "a truck broke down" or "the order file changed today". Mention the account if you know it.</div>
      <div class="input-bar">
        <div class="input-inner">
          <input type="text" id="chatInput" placeholder="Type your question or situation..." autocomplete="off">
          <button class="send-btn" id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  `;

  const chatInner = document.getElementById("chatInner");
  if(state.chat.messages.length === 0){
    chatInner.innerHTML = `
      <div class="msg-row assistant">
        <div class="bubble">Hi! Tell me what's happening and which account it's for -- for example "Haleon truck broke down" or "Oatside order file changed today" -- and I'll find the right SOP step for you.</div>
      </div>
    `;
  } else {
    chatInner.innerHTML = state.chat.messages.map((m, idx)=> renderMessage(m, idx)).join("");
  }
  if(state.chat.loading){
    chatInner.innerHTML += `
      <div class="msg-row assistant">
        <div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
      </div>
    `;
  }

  const scrollEl = document.getElementById("chatScroll");
  scrollEl.scrollTop = scrollEl.scrollHeight;

  wireChatCards();
  attachTermHandlers();

  const input = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");
  const doSend = ()=>{
    const val = input.value.trim();
    if(!val || state.chat.loading) return;
    input.value = "";
    handleUserMessage(val);
  };
  sendBtn.addEventListener("click", doSend);
  input.addEventListener("keydown", (e)=>{ if(e.key === "Enter") doSend(); });
  if(!state.chat.loading) input.focus();
}

function renderMessage(m, idx){
  if(m.role === "user"){
    return `<div class="msg-row user"><div class="bubble">${escapeHtml(m.text)}</div></div>`;
  }
  let bubbleClass = "bubble" + (m.notFound ? " bubble-warning" : "");
  let inner = `<div class="${bubbleClass}">${escapeHtml(m.text)}</div>`;
  if(m.suggestedReplies && m.suggestedReplies.length && !m.stepId){
    inner += `<div class="quick-replies" style="margin-top:8px;">` +
      m.suggestedReplies.map(s=>`<button class="qr-btn" data-action="suggest" data-text="${escapeHtml(s)}"><div class="qr-label">${escapeHtml(s)}</div></button>`).join("") +
      `</div>`;
  }
  if(m.stepId && m.process){
    const proc = PROCESSES[m.process];
    const node = proc.nodes[m.stepId];
    if(node) inner += renderStepCard(node, idx, proc);
  } else if(m.error){
    inner += `<div class="bubble" style="margin-top:4px;"><span class="error-note">${escapeHtml(m.error)}</span></div>`;
  }
  return `<div class="msg-row assistant"><div class="assistant-block">${inner}</div></div>`;
}

      </div>

  }
  if(node.type === "decision"){
    return `
      <div class="step-card" data-msgidx="${msgIdx}">
        ${accountTag}

function wireChatCards(){
  document.querySelectorAll('[data-action="advance"]').forEach(el=>{
    el.addEventListener("click", ()=>{
      const nextId = el.getAttribute("data-next");
      const label = el.getAttribute("data-label");
      advanceDeterministic(nextId, label);
    });
  });
  document.querySelectorAll('[data-action="restart"]').forEach(el=>{
    el.addEventListener("click", ()=>{
      state.chat = {messages:[], currentProcessKey:null, currentNodeId:null, loading:false};
      renderChat();
    });
  });
  document.querySelectorAll('[data-action="obtab"]').forEach(el=>{

    });

function advanceDeterministic(nextId, label){
  if(label){ state.chat.messages.push({role:"user", text: label}); }
  state.chat.processLocked = true;
  state.chat.currentNodeId = nextId;
  state.chat.messages.push({role:"assistant", text:"", stepId: nextId, process: state.chat.currentProcessKey});
  renderChat();
}

async function callGroq(apiMessages, knownProcessKey){
  const contextLine = `Current known context: process = ${state.chat.currentProcessKey || "unknown"}, current node = ${state.chat.currentNodeId || "not yet determined"}.`;
  const response = await fetch(GROQ_ENDPOINT, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + state.apiKey
    },
    body: JSON.stringify({
      model: GROQ_MODEL,
      max_tokens: 500,
      temperature: 0.2,
      response_format: {
        type: "json_schema",
        json_schema: {
          name: "sop_routing_response",
          strict: true,
          schema: RESPONSE_SCHEMA
        }
      },
      messages: [
        {role:"system", content: buildSystemPrompt(knownProcessKey) + "\n\n" + contextLine},
        ...apiMessages
      ]
    })
  });

  if(!response.ok){
    let bodyText = "";
    try{ bodyText = await response.text(); }catch(e){}
    const err = new Error(`Groq API returned HTTP ${response.status}`);
    err.status = response.status;
    err.body = bodyText;
    throw err;
  }

  const data = await response.json();
  const rawText = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : "";
  const cleaned = rawText.replace(/```json|```/g, "").trim();
  if(!cleaned){
    const err = new Error("Groq returned an empty response");
    err.body = JSON.stringify(data).slice(0, 300);
    throw err;
  }
  return JSON.parse(cleaned);
}

async function handleLocalDecision(text){
  if(!state.chat.currentProcessKey || !state.chat.currentNodeId) return false;
  const node = PROCESSES[state.chat.currentProcessKey]?.nodes[state.chat.currentNodeId];
  if(!node || node.type !== "decision") return false;
  const input=text.toLowerCase().trim();
  const match=node.options.find(o=>input===o.label.toLowerCase() || input===o.label.toLowerCase().split(" ")[0] || (input==="yes" && o.label.toLowerCase().startsWith("yes")) || (input==="no" && o.label.toLowerCase().startsWith("no")) || (input==="major" && o.label.toLowerCase().includes("major")) || (input==="minor" && o.label.toLowerCase().includes("minor")));
  if(!match) return false;
  advanceDeterministic(match.next, match.label);
  return true;
}

async function handleUserMessage(text){
  if(await handleLocalDecision(text)) return;
  if(!state.apiKey){
    state.keyModalOpen = true;
    renderRoot();
    return;
  }

  state.chat.messages.push({role:"user", text});
  state.chat.loading = true;
  renderChat();

  const apiMessages = state.chat.messages
    .filter(m => m.role === "user" || (m.role === "assistant" && m.text))
    .map(m => ({role: m.role, content: m.text}));

  const priorProcessKey = state.chat.currentProcessKey;

  try{
    let parsed = await callGroq(apiMessages, priorProcessKey);

    // If the process was just identified this turn but we hadn't sent its
    // full graph yet (payload stayed small), do one silent follow-up call
    // now that we know which graph to include, so step_id can be resolved
    // in the same visible turn.
    if(parsed.process && !parsed.step_id && !parsed.not_found && parsed.process !== priorProcessKey){
      parsed = await callGroq(apiMessages, parsed.process);
    }

    // Validation against hallucinated SOPs
    if(parsed.process && !PROCESSES[parsed.process]) throw new Error("AI returned unknown process");
    if(parsed.process && parsed.step_id && (!PROCESSES[parsed.process] || !PROCESSES[parsed.process].nodes[parsed.step_id])) throw new Error("AI returned invalid node");

    // Lock process once selected
    if(state.chat.processLocked && parsed.process && state.chat.currentProcessKey && parsed.process !== state.chat.currentProcessKey){
      parsed.process = state.chat.currentProcessKey;
      parsed.step_id = null;
      parsed.reply = "You are currently inside an active SOP. Click Start Over to switch processes.";
    }

    if(parsed.not_found){
      state.chat.currentProcessKey = null;
      state.chat.currentNodeId = null;
      state.chat.processLocked = false;
    } else {
      if(parsed.process){ state.chat.currentProcessKey = parsed.process; state.chat.processLocked = true; }
      if(parsed.step_id) state.chat.currentNodeId = parsed.step_id;
    }

    state.chat.messages.push({
      role: "assistant",
      text: parsed.reply || "",
      stepId: parsed.step_id || null,
      process: parsed.process || state.chat.currentProcessKey,
      notFound: !!parsed.not_found,
      suggestedReplies: parsed.suggested_replies || []
    });
  } catch(err){
    console.error("SOP Assistant — Groq request failed:", err);
    if(err.status === 401){
      state.apiKey = "";
      state.chat.messages.push({
        role:"assistant",
        text:"That API key was rejected (HTTP 401).",
        error:"Double-check the key at console.groq.com/keys, or generate a new one. Click \"Change API key\" above to re-enter it."
      });
      state.chat.loading = false;
      renderChat();
      return;
    }
    if(err.status === 429){
      state.chat.messages.push({
        role:"assistant",
        text:"Groq's free-tier rate limit was hit (HTTP 429).",
        error:"Wait a minute and try again — the free tier allows 30 requests/minute and a daily cap."
      });
      state.chat.loading = false;
      renderChat();
      return;
    }
    if(err.status){
      state.chat.messages.push({
        role:"assistant",
        text:`Groq returned an error (HTTP ${err.status}).`,
        error: (err.body || "").slice(0, 300) || "No further detail was returned. Try rephrasing, or switch to \"Browse step-by-step (offline)\" above."
      });
      state.chat.loading = false;
      renderChat();
      return;
    }
    // Network-level failure (no HTTP response at all) — try the offline fallback.
    const fallback = localKeywordMatch(text);
    if(fallback){
      state.chat.currentProcessKey = fallback.processKey;
      state.chat.currentNodeId = fallback.nodeId;
      state.chat.messages.push({
        role:"assistant",
        text:"Couldn't reach Groq (network error), but based on your wording this looks like the closest match:",
        stepId: fallback.nodeId,
        process: fallback.processKey
      });
    } else {
      state.chat.messages.push({
        role:"assistant",
        text:"Couldn't reach Groq and couldn't find a close match locally.",
        error: (err.message || "Unknown network error") + " — check your internet connection, try rephrasing, or switch to \"Browse step-by-step (offline)\" above."
      });
    }
  }
  state.chat.loading = false;
  renderChat();
}

/* ---------- Local offline keyword fallback ---------- */
const SEARCH_INDEX = [];
(function buildIndex(){
  for(const proc of Object.values(PROCESSES)){
    for(const [id, n] of Object.entries(proc.nodes)){
      let text = (n.role||"") + " " + (n.title||"") + " " + (n.question||"");
      if(n.bullets) text += " " + n.bullets.map(stripTags).join(" ");
      if(n.options) text += " " + n.options.map(o=>o.label + " " + (o.hint||"")).join(" ");
      if(n.body) text += " " + n.body;
      SEARCH_INDEX.push({processKey: proc.key, nodeId: id, text: text.toLowerCase()});
    }
  }
})();
function localKeywordMatch(query){
  const words = query.toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>2);
  if(words.length === 0) return null;
  let best = null, bestScore = 0;
  for(const entry of SEARCH_INDEX){
    let score = 0;
    for(const w of words){ if(entry.text.includes(w)) score++; }
    if(score > bestScore){ bestScore = score; best = entry; }
  }
  if(best && bestScore >= 2) return best;
  return null;
}

/* ============================= BROWSE MODE (offline fallback) ============================= */
function renderBrowse(){
  const body = document.getElementById("body");
  if(!state.browse.processKey){
    const accountOrder = ["Haleon", "Oatside", "Fonterra", "General"];
    const grouped = {};
    Object.values(PROCESSES).forEach(proc => {
      if(!grouped[proc.account]) grouped[proc.account] = [];
      grouped[proc.account].push(proc);
    });
    body.innerHTML = `
      <div class="browse-stage" style="width:100%;">
        <div class="browse-inner" style="max-width:680px;">
          <h2 style="font-size:22px; margin:0 0 8px;">Browse a process manually</h2>
          <p style="color:var(--slate); font-size:14.5px; margin:0 0 22px;">This mode works fully offline. Pick an account, then a process to step through it.</p>
          ${accountOrder.filter(a => grouped[a]).map(account => `
            <div style="margin-bottom:22px;">
              <div style="font-size:13px; font-weight:700; color:var(--slate); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:10px;">${account === "General" ? "General / Company-wide" : account}</div>
              ${grouped[account].map(proc => `
                <div class="proc-card" data-key="${proc.key}">
                  <div class="proc-tag">${proc.processType}</div>
                  <h2>${proc.name}</h2>
                  <p>${proc.blurb}</p>
                </div>
              `).join("")}
            </div>
          `).join("")}
        </div>
      </div>
    `;
    body.querySelectorAll(".proc-card").forEach(el=>{
      el.addEventListener("click", ()=>{
        const key = el.getAttribute("data-key");
        state.browse.processKey = key;
        state.browse.history = [PROCESSES[key].startId];
        renderBrowse();
      });
    });
    return;
  }

  const proc = PROCESSES[state.browse.processKey];
  const currentId = state.browse.history[state.browse.history.length - 1];
  const node = proc.nodes[currentId];

  body.innerHTML = `
    <aside class="rail">
      <div class="rail-process">${proc.name}</div>
      <div id="railTrail"></div>
    </aside>
    <div class="browse-stage">
      <div class="browse-inner" id="browseCard"></div>
    </div>
  `;

  const trailEl = document.getElementById("railTrail");
  trailEl.innerHTML = state.browse.history.map((id, idx)=>{
    const n = proc.nodes[id];
    const isCurrent = idx === state.browse.history.length - 1;
    const roleLabel = n.type === "end" ? "Outcome" : n.role;
    const titleLabel = n.title || n.question || "";
    return `
      <div class="trail-item ${isCurrent?'current':'done'}" data-idx="${idx}">
        <div class="dot-col"><div class="dot"></div>${idx < state.browse.history.length -1 ? '<div class="stem"></div>' : ''}</div>
        <div><div class="trail-role">${roleLabel}</div><div class="trail-title">${titleLabel}</div></div>
      </div>
    `;
  }).join("");
  trailEl.querySelectorAll(".trail-item").forEach(el=>{
    el.addEventListener("click", ()=>{
      const idx = parseInt(el.getAttribute("data-idx"));
      if(idx < state.browse.history.length - 1){
        state.browse.history = state.browse.history.slice(0, idx+1);
        renderBrowse();
      }
    });
  });

  const cardEl = document.getElementById("browseCard");
  cardEl.innerHTML = renderBrowseNode(node, proc);
  attachTermHandlers();

  const backBtn = document.getElementById("browseBack");
  if(backBtn) backBtn.addEventListener("click", ()=>{
    state.browse.history = state.browse.history.slice(0, -1);
    renderBrowse();
  });
  if(node.type === "step"){
    document.getElementById("browseNext").addEventListener("click", ()=>{
      state.browse.history.push(node.next);
      renderBrowse();
    });
    if(node.showOutboundDetail){
      cardEl.querySelectorAll('[data-action="obtab"]').forEach(el=>{
        el.addEventListener("click", ()=>{
          state.browse.outboundTab = el.getAttribute("data-tab");
          renderBrowse();
        });
      });
    }
  }
  if(node.type === "decision"){
    cardEl.querySelectorAll(".qr-btn").forEach(el=>{
      el.addEventListener("click", ()=>{
        state.browse.history.push(el.getAttribute("data-next"));
        renderBrowse();
      });
    });
  }
  if(node.type === "end"){
    document.getElementById("browseRestart").addEventListener("click", ()=>{
      state.browse.history = [proc.startId];
      renderBrowse();
    });
  }
}

function renderBrowseNode(node, proc){
  const accountTag = `<div class="account-tag">${proc.account} \u00b7 ${proc.processType}</div>`;
  if(node.type === "step"){
    return `
      ${accountTag}
      <div class="role-chip">${node.role}</div>
      <h2 style="font-size:22px; margin:0 0 16px;">${node.title}</h2>
      <ul class="bullets">${node.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>
      ${node.showOutboundDetail ? renderBrowseOutbound() : ""}
      <div class="btn-row">
        ${state.browse.history.length > 1 ? `<button class="ghost-btn" id="browseBack">← Back</button>` : ""}
        <button class="primary-btn" id="browseNext">Next step →</button>
      </div>
    `;
  }
  if(node.type === "decision"){
    return `
      ${accountTag}
      <div class="role-chip decision">${node.role} decides</div>
      <h2 style="font-size:22px; margin:0 0 14px;">${node.title}</h2>
      <p class="question-text">${node.question}</p>
      <div class="quick-replies">
        ${node.options.map(opt=>`
          <button class="qr-btn" data-next="${opt.next}">
            <div class="qr-label">${opt.label}</div>
            ${opt.hint ? `<div class="qr-hint">${opt.hint}</div>` : ""}
          </button>
        `).join("")}
      </div>
      ${state.browse.history.length > 1 ? `<div class="btn-row"><button class="ghost-btn" id="browseBack">← Back</button></div>` : ""}
    `;
  }
  if(node.type === "end"){
    return `
      ${accountTag}
      <div class="step-card ${node.tone}" style="padding:22px 24px;">
        <div class="end-badge">Process complete</div>
        <h2 style="font-size:21px; margin:0 0 8px;">${node.title}</h2>
        <p style="margin:0; font-size:15px; line-height:1.55; color:#2A3A45;">${node.body}</p>
      </div>
      <div class="btn-row">
        <button class="ghost-btn" id="browseBack">← Back</button>
        <button class="primary-btn" id="browseRestart">Restart this process</button>
      </div>
    `;
  }
  return "";
}
function renderBrowseOutbound(){
  const active = state.browse.outboundTab;
  const steps = OUTBOUND_STEPS[active];
  return `
    <div style="margin:6px 0 20px;">
      <div class="ob-summary">Detailed loading &amp; dispatch steps</div>
      <div class="outbound-toggle">
        <button class="ob-tab ${active==='palletized'?'active':''}" data-action="obtab" data-tab="palletized">Palletized (TT/DC)</button>
        <button class="ob-tab ${active==='nonpalletized'?'active':''}" data-action="obtab" data-tab="nonpalletized">Non-palletized (KA)</button>
      </div>
      <ol class="ob-list">${steps.map(s=>`<li>${s}</li>`).join("")}</ol>
    </div>
  `;
}

/* ============================= TOOLTIPS ============================= */
const tooltipEl = document.getElementById("tooltip");
let tooltipOpenFor = null;
function attachTermHandlers(){
  document.querySelectorAll(".term").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const key = el.getAttribute("data-key");
      if(tooltipOpenFor === el){ hideTooltip(); return; }
      showTooltip(el, GLOSSARY[key] || "No definition available.");
      tooltipOpenFor = el;
    });
  });
}
function showTooltip(el, text){
  tooltipEl.textContent = text;
  tooltipEl.classList.add("visible");
  const rect = el.getBoundingClientRect();
  let left = rect.left;
  const maxLeft = window.innerWidth - 296;
  if(left > maxLeft) left = maxLeft;
  if(left < 12) left = 12;
  tooltipEl.style.top = (rect.bottom + 10) + "px";
  tooltipEl.style.left = left + "px";
}
function hideTooltip(){ tooltipEl.classList.remove("visible"); tooltipOpenFor = null; }
document.addEventListener("click", hideTooltip);
document.addEventListener("keydown", (e)=>{ if(e.key === "Escape") hideTooltip(); });

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

/* ============================= INIT ============================= */
renderRoot();
</script>
</body>
</html>
